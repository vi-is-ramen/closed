[package]
name = "closed"
version = "0.0.2-2"
edition = "2024"
rust-version = "1.85"
description = "Type-erased callable objects for Rust"
license = "MIT OR Apache-2.0"
authors = ["Ivan Chetchasov <vi.is.chapmann@gmail.com"]
repository = "https://github.com/vi-is-ramen/suv"
homepage = "https://github.com/vi-is-ramen/suv"
keywords = ["callable", "function", "type-erasure", "std-function", "closure"]
categories = ["rust-patterns", "no-std", "asynchronous"]

[build-dependencies]
rustversion = "1.0"

[features]
default = ["std"]
std = []

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
