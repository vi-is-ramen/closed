[package]
name = "closed"
version = { workspace = true }
edition = "2024"
rust-version = "1.88"
description = "Type-erased callable objects for Rust"
license = "MIT OR Apache-2.0"
authors = ["Ivan Chetchasov <vi.is.chapmann@gmail.com"]
repository = "https://github.com/vi-is-ramen/closed"
homepage = "https://github.com/vi-is-ramen/closed"
keywords = ["callable", "function", "type-erasure", "std-function", "closure"]
categories = ["rust-patterns", "no-std", "asynchronous"]

[features]
default = ["std", "macros"]
std = []
unstable = ["dep:typeid", "dep:nohash"]
private = []
macros = ["dep:closed-proc-macros"]

[dependencies]
closed-proc-macros = { workspace = true, optional = true }
typeid = { version = "1.0.3", optional = true }
nohash = { version = "0.2.0", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
criterion = { version = "0.8.2" }

# [[bench]]
# name = "callable_bench"
# harness = false
